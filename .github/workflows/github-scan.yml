name: github-scan
on:
  schedule:
    - cron: "10 * * * *" # varje timme (UTC, minut 10 för att undvika rusning)
  workflow_dispatch: {}

concurrency:
  group: github-scan
  cancel-in-progress: false

jobs:
  scan:
    # Railway tar över cron när repo-variabeln sätts till false.
    # Manuell Run workflow fungerar alltid som reserv.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUN_SCHEDULED_SCANNERS_ON_GITHUB != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run github:selftest
      - run: npm run github
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_MAYBE: ${{ secrets.DISCORD_WEBHOOK_MAYBE }}
          DISCORD_WEBHOOK_GITHUB_DRIFT: ${{ secrets.DISCORD_WEBHOOK_GITHUB_DRIFT }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_PROVEN_ID: ${{ secrets.CHANNEL_PROVEN_ID }}
          CHANNEL_WATCHLIST_ID: ${{ secrets.CHANNEL_WATCHLIST_ID }}
          # GH_API_TOKEN-secret om du skapat en egen; annars räcker Actions inbyggda token
          GITHUB_API_TOKEN: ${{ secrets.GH_API_TOKEN || github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_CLAUDE_MONTHLY_BUDGET_USD: "65"
          GITHUB_RUN_DEADLINE_MINUTES: "22"

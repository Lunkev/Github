name: news-scan
on:
  schedule:
    # Varje timme, minut 17 för att undvika GitHub Actions rusning vid hel timme.
    - cron: "17 * * * *"
  workflow_dispatch: {} # manuell körning från Actions-fliken

jobs:
  news:
    # Railway tar över cron när repo-variabeln sätts till false.
    # Manuell Run workflow fungerar alltid som reserv.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.RUN_SCHEDULED_SCANNERS_ON_GITHUB != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_NEWS_WATCHLIST_ID: ${{ secrets.CHANNEL_NEWS_WATCHLIST_ID }}
          CHANNEL_NEWS_EXAMPLES_ID: ${{ secrets.CHANNEL_NEWS_EXAMPLES_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
